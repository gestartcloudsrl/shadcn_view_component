name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bin/rubocop --format github

      # The JavaScript half. Node is a development dependency only — the gem
      # ships no npm package — so it is installed here and nowhere else.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Through the binstub, for the reason the test job goes through
      # `bin/setup`: the documented entry point is the one worth exercising.
      # `npm ci` above is what makes it a lint rather than an install.
      - run: bin/eslint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The system specs drive a real browser.
      - uses: browser-actions/setup-chrome@v1

      # Through bin/setup rather than its steps, so the documented entry point
      # is exercised too.
      - name: Setup
        run: ./bin/setup

      - name: Specs
        run: bundle exec rspec

      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-failures-ruby-${{ matrix.ruby }}
          path: test/dummy/tmp/capybara
          if-no-files-found: ignore

      # The generated theme and icon files are committed; regenerating must be a
      # no-op, or someone edited them by hand instead of the source JSON and the
      # vendored SVGs.
      - name: Generated files are up to date
        run: |
          bundle exec rake themes:build
          bundle exec rake icons:build
          git diff --exit-code
