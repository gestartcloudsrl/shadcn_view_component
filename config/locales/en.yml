# Every user-visible string the components render. shadcn hardcodes these in
# English; a Rails app is likely not English-only, so they go through I18n with
# the upstream text as the default. Override any key in your own locale files.
en:
  shadcn_view_component:
    breadcrumb:
      label: breadcrumb
      more: More
    calendar:
      previous: Go to the Previous Month
      next: Go to the Next Month
      today_label: "Today, %{date}"
      selected_label: "%{date}, selected"
      week_number_header: Week Number
      week_number: "Week %{number}"
      choose_month: Choose the Month
      choose_year: Choose the Year
    chart:
      label: Chart
      value: Value
    combobox:
      clear: Clear
      toggle: Show options
      remove: Remove
      # The chips field's accessible name, when the caller gave it no
      # placeholder to borrow one from.
      add: Add an item
    carousel:
      previous: Previous slide
      next: Next slide
    dialog:
      close: Close
    event_calendar:
      previous: Go to the Previous Month
      next: Go to the Next Month
      today: Today
      empty: Nothing scheduled.
      all_day: All day
      # A job that started before this day and stops during it.
      until: "→ %{time}"
      done: Done
      attachment: Has an attachment
      assignee_status:
        done: Done
        pending: Pending
      agenda_label: Events on the selected day
      # The "+2" a cell shows when it has more events than lanes. A template
      # rather than a sentence: the controller re-renders it for a month the
      # server never drew.
      more: "+%{count}"
      day_label: "%{date}, %{events}"
      # What a move says out loud, into a region of its own — the calendar's
      # other `role="status"` is the title, and the month lives there.
      # Templates rather than sentences, like `more` above: the controller
      # renders them for an event and a day the server never saw.
      picked: "%{title} picked. Choose a day with the arrow keys, then press Space."
      moved: "%{title} moved to %{date}."
      returned: "%{title} put back on %{date}."
      event_count:
        one: 1 event
        other: "%{count} events"
      # Read by the controller's `strftime` shim as well as by `I18n.l`, so it
      # is limited to the date tokens that shim knows: %A %a %B %b %d %-d %e
      # %m %-m %Y %y.
      agenda_format: "%A, %B %-d"
      # The workload reading's arrangement toggle. It names what pressing it
      # does, not the state it is in, so the controller never has to write it.
      # The options panel: which view, and then the one question that view has.
      # The toolbar's period switch, which is the question above the views.
      period:
        label: Show
        monthly: Monthly
        weekly: Weekly
        daily: Daily
      # What a day shows: the axis says when it is busy and cannot write a name,
      # the agenda says what each job is and cannot show a gap. Named after the
      # month's view rather than after the hours, so the same thing is called
      # the same thing in both — see `view.hours` below.
      daily:
        label: Show the day as
        axis: Timeline only
        agenda: List only
        both: Timeline and list
      previous_day: Go to the Previous Day
      next_day: Go to the Next Day
      previous_week: Go to the Previous Week
      next_week: Go to the Next Week
      # The label is **Timeline** and the key, the reading and the value that
      # reaches `view_url:` are all still `hours`, deliberately: "Hours"
      # described the axis it is drawn on, which is a fact about how it works
      # rather than about what it shows, and the vocabulary a host's callback is
      # handed is public API that a rename would break. So the divergence is on
      # purpose and it lives here, in the one place a person reads.
      view:
        label: Show the month as
        grid: Grid
        rows: Rows
        hours: Timeline
      # The hours reading's shape menu — see `Hours::Component::LANE_HEIGHTS`.
      # A bar is as wide as the job lasts and says nothing else; a chip says who
      # and for whom, and is as wide as that takes.
      hours:
        label: Show each job as
        bars: Bars
        chips: Chips
      # The grouping menu, shared by the workload and daily readings through
      # `EventCalendar::Groupings` — see its `GROUPINGS`. `show_all` below is
      # the workload's alone.
      #
      # "Group by" rather than "Group cells by": a cell is what the workload
      # groups, and a day has no cells — it groups its rows and the sections of
      # its agenda. The label was written from the reading that had it first.
      group:
        label: Group by
        assignees: By assignee
        events: By event
        show_all: Show all
      # Times never reach the shim — the server formats every one of them and
      # ships it with the event — so this may use any token `strftime` has.
      time_format: "%-l:%M %p"
    pagination:
      label: pagination
      previous: Previous
      next: Next
      go_to_previous: Go to previous page
      go_to_next: Go to next page
      more: More pages
    toaster:
      label: Notifications
      dismiss: Dismiss
    select:
      search_label: Search options
      empty: No results found.
      dialog_label: Select an option
      list_label: Options
    message_scroller:
      scroll_to_end: Scroll to end
      scroll_to_start: Scroll to start
    sidebar:
      toggle: Toggle Sidebar
      title: Sidebar
      description: Displays the mobile sidebar.
    spinner:
      loading: Loading
    theme:
      toggle: Toggle theme
      label: Theme
      light: Light
      dark: Dark
      system: System
