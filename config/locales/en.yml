# Every user-visible string the components render. shadcn hardcodes these in
# English; a Rails app is likely not English-only, so they go through I18n with
# the upstream text as the default. Override any key in your own locale files.
en:
  shadcn_view_component:
    breadcrumb:
      label: breadcrumb
      more: More
    calendar:
      previous: Go to the Previous Month
      next: Go to the Next Month
      today_label: "Today, %{date}"
      selected_label: "%{date}, selected"
      week_number_header: Week Number
      week_number: "Week %{number}"
      choose_month: Choose the Month
      choose_year: Choose the Year
    chart:
      label: Chart
      value: Value
    combobox:
      clear: Clear
      toggle: Show options
      remove: Remove
      # The chips field's accessible name, when the caller gave it no
      # placeholder to borrow one from.
      add: Add an item
    carousel:
      previous: Previous slide
      next: Next slide
    dialog:
      close: Close
    event_calendar:
      previous: Go to the Previous Month
      next: Go to the Next Month
      today: Today
      empty: Nothing scheduled.
      all_day: All day
      # A job that started before this day and stops during it.
      until: "→ %{time}"
      agenda_label: Events on the selected day
      # The "+2" a cell shows when it has more events than lanes. A template
      # rather than a sentence: the controller re-renders it for a month the
      # server never drew.
      more: "+%{count}"
      day_label: "%{date}, %{events}"
      event_count:
        one: 1 event
        other: "%{count} events"
      # Read by the controller's `strftime` shim as well as by `I18n.l`, so it
      # is limited to the date tokens that shim knows: %A %a %B %b %d %-d %e
      # %m %-m %Y %y.
      agenda_format: "%A, %B %-d"
      # The workload reading's arrangement toggle. It names what pressing it
      # does, not the state it is in, so the controller never has to write it.
      # The options panel: which view, and then the one question that view has.
      view:
        label: Show the month as
        grid: Grid
        rows: Rows
        hours: Hours
      # The hours reading's shape menu — see `Hours::Component::LANE_HEIGHTS`.
      # A bar is as wide as the job lasts and says nothing else; a chip says who
      # and for whom, and is as wide as that takes.
      hours:
        label: Show each job as
        bars: Bars
        chips: Chips
      # The workload reading's grouping menu — see
      # `EventCalendar::Component::WORKLOAD_GROUPINGS`.
      group:
        label: Group cells by
        assignees: By assignee
        events: By event
        show_all: Show all
      # Times never reach the shim — the server formats every one of them and
      # ships it with the event — so this may use any token `strftime` has.
      time_format: "%-l:%M %p"
    pagination:
      label: pagination
      previous: Previous
      next: Next
      go_to_previous: Go to previous page
      go_to_next: Go to next page
      more: More pages
    toaster:
      label: Notifications
      dismiss: Dismiss
    select:
      search_label: Search options
      empty: No results found.
      dialog_label: Select an option
      list_label: Options
    message_scroller:
      scroll_to_end: Scroll to end
      scroll_to_start: Scroll to start
    sidebar:
      toggle: Toggle Sidebar
      title: Sidebar
      description: Displays the mobile sidebar.
    spinner:
      loading: Loading
    theme:
      toggle: Toggle theme
      label: Theme
      light: Light
      dark: Dark
      system: System
